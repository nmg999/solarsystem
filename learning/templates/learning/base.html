<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Hub{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fb; color: #20304a; font-family: system-ui, sans-serif; line-height: 1.65; }
    header, main { max-width: 960px; margin: auto; padding: 28px 24px; }
    header a { font-weight: 750; color: #20304a; text-decoration: none; }
    main { padding-top: 50px; }
    h1 { font-size: clamp(2.5rem, 7vw, 4rem); line-height: 1.1; margin: 12px 0 24px; }
    .eyebrow { color: #32634d; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; }
    .intro { max-width: 620px; color: #526078; font-size: 1.15rem; }
    .subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 38px; }
    .card { background: white; padding: 28px; border: 1px solid #dce4ee; border-radius: 18px; }
    h2 { margin-top: 0; }
    .button { display: inline-block; background: #27634d; color: white; padding: 12px 24px; border-radius: 9px; text-decoration: none; font-weight: 650; }
    a:focus-visible { outline: 3px solid #b97512; outline-offset: 5px; }
    .button:hover { background: #194b39; }
    .soon { color: #64748b; font-size: .9rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .account-nav { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: .9rem; }
    .account-nav form { margin: 0; }
    button.button { font: inherit; border: 0; cursor: pointer; }
    .account-nav a.button { color: white; }
    button:focus-visible, input:focus-visible { outline: 3px solid #b97512; outline-offset: 4px; }
    .auth-card { max-width: 520px; margin: 0 auto 40px; }
    .auth-card h1 { font-size: 2.4rem; }
    .auth-card label { display: block; font-weight: 650; margin: 18px 0 6px; }
    .auth-card input { width: 100%; padding: 12px; border: 1px solid #a8b6c8; border-radius: 8px; font: inherit; }
    .auth-card .helptext { display: block; font-size: .85rem; color: #526078; margin-top: 6px; }
    .auth-card .errorlist { color: #9c2632; padding-left: 20px; }
    .auth-card a { color: #27634d; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'learning:home' %}">Study Hub</a>
    <nav class="account-nav" aria-label="Account">
      {% if user.is_authenticated %}
        <span>Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'learning:logout' %}">{% csrf_token %}<button class="button" type="submit">Log out</button></form>
      {% else %}
        <a href="{% url 'learning:login' %}">Log in</a>
        <a class="button" href="{% url 'learning:signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
